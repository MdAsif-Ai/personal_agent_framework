[project]
name = "coworker-ai"
version = "0.2.0"
description = "Autonomous AI Co-Worker with real browser, persistent MCP filesystem, search, and human-in-the-loop evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.0.0",
    "langchain>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-openai>=1.0.0",
    "langchain-mcp-adapters>=0.2.0",
    "langgraph>=1.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-pptx>=1.0.0",
    "requests>=2.30.0",
    "wikipedia>=1.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
